[workspace]
resolver = "2"
members = ["crates/logging", "crates/templating", "crates/oidc"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
common-logging = { path = "crates/logging", version = "0.3.0" }
common-templating = { path = "crates/templating", version = "0.3.0" }

# Shared by two or more members.
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = "1"
# UNENFORCED (§11.1): nothing in the build fails if default-features comes back
# on here — it would just pull openssl through reqwest, silently.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
