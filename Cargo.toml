[workspace]
resolver = "2"
members = [
    "crates/logging",
    "crates/templating",
    "crates/theme",
    "crates/common-ui-core",
    "crates/oidc",
    "crates/ui-build",
    "crates/config",
    "crates/config-derive",
    "crates/routing",
    "crates/routing-macros",
    "crates/common-secrets",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
common-logging = { path = "crates/logging", version = "0.3.0" }
common-templating = { path = "crates/templating", version = "0.3.0" }
common-theme = { path = "crates/theme", version = "0.3.0" }
common-ui-core = { path = "crates/common-ui-core", version = "0.3.0" }
common-ui-build = { path = "crates/ui-build", version = "0.3.0" }
common-config = { path = "crates/config", version = "0.3.0" }
common-config-derive = { path = "crates/config-derive", version = "0.3.0" }
common-routing = { path = "crates/routing", version = "0.3.0" }
common-routing-macros = { path = "crates/routing-macros", version = "0.3.0" }
common-secrets = { path = "crates/common-secrets", version = "0.3.0" }

# Shared by two or more members.
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = "1"
# UNENFORCED (§11.1): nothing in the build fails if default-features comes back
# on here — it would just pull openssl through reqwest, silently.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
