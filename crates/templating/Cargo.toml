[package]
name = "common-templating"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared template + static-asset rendering for Les services: minijinja + an mtime/params-keyed asset cache over a validated dir"

[dependencies]
# default-features off sheds `multi_template` (R29/R30): templates cannot
# reference each other, so one render reads one file and its mtime is exact.
# `loader` goes with it — it existed to resolve extends/include.
# `serde` is KEPT: `Template::render<S: Serialize>` is an unconditional bound,
# and minijinja depends on serde non-optionally regardless, so dropping the
# feature would buy no dependency and only deprecate `Environment::new`.
minijinja = { version = "2", default-features = false, features = [
    "builtins",
    "debug",
    "serde",
] }
# integrity pins for served logic / library templates.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# set mtimes forward to test cache invalidation deterministically
filetime = "0.2"
