[package]
name = "common-templating"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared template + static-asset rendering for Les services: minijinja + an mtime/params-keyed asset cache over a validated dir"

[dependencies]
# "loader": render_ctx resolves {% extends %}/{% include %} through a
# per-call path_loader over the validated asset dir for data-driven pages.
minijinja = { version = "2", features = ["loader"] }
# the render_ctx context bound; no derive needed here.
serde.workspace = true
# integrity pins for served logic / library templates.
sha2.workspace = true
thiserror.workspace = true
# raw fcntl(F_NOTIFY) and inotify: the `notify` crate does not offer dnotify.
libc = "0.2"

[dev-dependencies]
# set mtimes forward to test cache invalidation deterministically
filetime = "0.2"
# derive for render_ctx test contexts
serde = { workspace = true, features = ["derive"] }
