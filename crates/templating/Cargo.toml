[package]
name = "common-templating"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared shell stamping + static-asset serving for Les services: upon for the two runtime markers, an mtime-keyed asset cache over a validated dir"

[dependencies]
# `serde` alone: `Template::render` takes any `Serialize` context, which is
# how the two runtime values reach the shell. `functions` (filters) and
# `unicode` (identifier/width rules) buy nothing for a `{{name}}`-only grammar
# with ASCII marker names, and `syntax` is left off on purpose (R114 item 4).
upon = { version = "0.11", default-features = false, features = ["serde"] }
common-logging.workspace = true
http = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tower-http = { version = "0.6", default-features = false, features = ["set-header"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
axum = "0.8"
filetime = "0.2"
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
