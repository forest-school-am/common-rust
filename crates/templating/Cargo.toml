[package]
name = "common-templating"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared template + static-asset rendering for Les services: minijinja + an mtime/params-keyed asset cache over a validated dir"

[dependencies]
# `serde` is KEPT because `Template::render<S: Serialize>` is an unconditional
# bound and minijinja depends on serde non-optionally regardless: dropping the
# feature would buy no dependency and only deprecate `Environment::new`.
minijinja = { version = "2", default-features = false, features = [
    "builtins",
    "debug",
    "serde",
] }
common-logging.workspace = true
http = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ts-rs = "10"
tower-http = { version = "0.6", default-features = false, features = ["set-header"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
axum = "0.8"
filetime = "0.2"
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
