[package]
name = "common-templating"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared template + static-asset rendering for Les services: minijinja + an mtime/params-keyed asset cache over a validated dir"

[dependencies]
# `serde` is KEPT because `Template::render<S: Serialize>` is an unconditional
# bound and minijinja depends on serde non-optionally regardless: dropping the
# feature would buy no dependency and only deprecate `Environment::new`.
minijinja = { version = "2", default-features = false, features = [
    "builtins",
    "debug",
    "serde",
] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
filetime = "0.2"
