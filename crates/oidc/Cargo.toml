[package]
name = "common-oidc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared in-app OIDC for stand apps: BFF sessions, per-request userinfo, server-side refresh (session ruling v5)"
# Publishes the served-template directory to dependents' build scripts as
# DEP_COMMON_OIDC_ASSETS (cargo derives that name from THIS `links` value, not
# from the package name: `links = "common-oidc"` + `cargo:assets=` =>
# DEP_COMMON_OIDC_ASSETS). It is how adopters copy the shim template without a
# `../common-oidc` sibling path, so it works for git deps too.
links = "common-oidc"

[dependencies]
# Workspace siblings: logging and asset rendering. Before the
# R15 merge these were git deps by tag, so this crate's own tests compiled
# against the published crates while every consumer built against the local
# ones — the two silently diverged. As workspace members they cannot.
common-logging.workspace = true
common-templating.workspace = true
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# derive the served shim's integrity-pin hash at build time.
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# cookies: the live canary drives authentik's flow executor like a browser
reqwest = { workspace = true, features = ["cookies"] }
