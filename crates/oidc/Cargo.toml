[package]
name = "common-oidc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared in-app OIDC for stand apps: BFF sessions, per-request userinfo, server-side refresh"

[dependencies]
common-config.workspace = true
common-logging.workspace = true
common-routing.workspace = true
axum = "0.8"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
axum-extra = { version = "0.10", features = ["cookie"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { workspace = true, features = ["cookies"] }
