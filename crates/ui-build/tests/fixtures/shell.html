<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[title]]</title>
<!-- R89 addendum: ONE marker serves twice. The emoji is rendered into an SVG
     text element for the favicon, and the same value is handed to the bar as
     its app chip. Single quotes inside so the attribute stays double-quoted.
     An empty app_icon leaves a blank SVG here and no chip in the bar. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>[[app_icon]]</text></svg>">
<link rel="stylesheet" href="{{assets_origin}}/[[prefix]]/base.css" integrity="[[sri_base_css]]" crossorigin="anonymous">
<link rel="stylesheet" href="{{assets_origin}}/[[prefix]]/theme-default/palette.css" integrity="[[sri_palette_css]]" crossorigin="anonymous">
{{theme_override}}
<link rel="stylesheet" href="{{assets_origin}}/[[prefix]]/elements.css" integrity="[[sri_elements_css]]" crossorigin="anonymous">
<link rel="stylesheet" href="[[page_css]]">
<script type="module" src="{{assets_origin}}/[[prefix]]/common-ui.js" integrity="[[sri_common_ui_js]]" crossorigin="anonymous"></script>
<script type="module" src="[[page_module]]"></script>
</head>
<body>
<!-- The pages are `<a>` CHILDREN, read as data (R72/§12.16): they are in the
     initial HTML so the bar still navigates when common-ui.js is blocked, and
     a shadow root with no slot stops rendering them once the element upgrades.
     The bar_pages marker below is ONE marker holding the whole list with
     aria-current already on the current link, so the current page costs no
     extra marker. NO MARKER IS SPELLED WITH ITS BRACKETS IN THIS COMMENT:
     stamping substitutes them here too, which shipped the page list twice on
     every consumer's pages — and a label containing an end-comment sequence
     would have broken out of the comment into live markup. build.sh refuses
     it now. The account is rendered BY the bar; the page module injects
     launcher, logout and user from the config block on its first lines. -->
<les-bar app="[[app_name]]" icon="[[app_icon]]">[[bar_pages]]</les-bar>
<main id="root" class="[[root_class]]"></main>
<!-- R86. footer_app and footer_commit are COMPOSED by build.rs, not raw
     values: whether each is a link depends on whether source_url is set, and
     a conditional href cannot come out of a string substitution — an empty
     source_url would leave href="". build.rs already holds source_url, so the
     choice belongs there and the shell takes either plain text or an anchor.
     An empty commit is a build error on the consumer's side; the marker being
     present is all this file can enforce. The prefix is printed so a page
     tells you which common-ui it is running. -->
<footer>
  [[footer_app]] · [[footer_commit]] · [[legal]] · [[prefix]]
</footer>
<script type="application/json" id="config">{{config}}</script>
</body>
</html>
