[package]
name = "common-ui-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build-script helper for common-ui consumers (R117): stamp the shell's [[build markers]], expose the shared SRI/prefix markers and the CSP, and write the d.ts to OUT_DIR — all read from the common-ui-core / common-theme crates. No Garage fetch."

[dependencies]
# The assets themselves: this crate is the build-time glue around them, so the
# SRIs, the d.ts and the CSP are read straight from the crates that carry the
# bytes — no fetch, no manifest, no pin machinery.
common-ui-core = { workspace = true, features = ["build"] }
common-theme.workspace = true
# The stamp engine moved with the glue: common-ui-core's `build` feature pulls it.
