[package]
name = "common-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared logging for Les stand crates: subscriber setup, designators, emission macros, request-span helper, boot (config load + refusal + init)"

[dependencies]
# Refusal and Deployment live there and are
# re-exported here under their old paths; `boot` loads a consumer's config
# through it.
common-config.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
    "json",
    "registry",
] }
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
