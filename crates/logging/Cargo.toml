[package]
name = "common-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared logging for Les stand crates (CODESTYLE.md §8): subscriber setup, designators, emission macros, request-span helper"

[dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
    "json",
    "registry",
] }
# RFC3339 timestamps for the human format (small, well-tested — §11.3).
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

[dev-dependencies]
serde_json.workspace = true
